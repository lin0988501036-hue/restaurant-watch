name: Test notification

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Send test notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -fsS \
            -H "Title: Restaurant Watch" \
            -H "Priority: high" \
            -d "Restaurant Watch 測試成功 ✅" \
            "https://ntfy.sh/${NTFY_TOPIC}"
