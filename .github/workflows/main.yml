name: Restaurant Watch

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Restore last status
        uses: actions/cache/restore@v4
        with:
          path: .rw-state
          key: rw-state-${{ github.run_id }}
          restore-keys: |
            rw-state-

      - name: Prepare state
        run: mkdir -p .rw-state

      - name: Build monitor
        run: docker build -t restaurant-watch .

      - name: Check 大班樓
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          docker run --rm -i \
            -e NTFY_TOPIC="$NTFY_TOPIC" \
            -v "$PWD/.rw-state:/app/state" \
            --entrypoint python \
            restaurant-watch - <<'PY'

          import asyncio
          import hashlib
          import os
          from pathlib import Path
          import httpx
          from playwright.async_api import async_playwright

          URL = "https://www.thechairmangroup.com/index.php?route=catering/booking"
          STATE = Path("/app/state/chairman.txt")

          async def notify(message):
              topic = os.environ.get("NTFY_TOPIC")
              if not topic:
                  raise RuntimeError("NTFY_TOPIC 沒有設定")

              async with httpx.AsyncClient(timeout=15) as client:
                  r = await client.post(
                      f"https://ntfy.sh/{topic}",
                      content=message.encode("utf-8"),
                      headers={
                          "Title": "大班樓 Restaurant Watch",
                          "Priority": "high"
                      }
                  )
                  r.raise_for_status()

          async def main():
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)

                  page = await browser.new_page(
                      locale="zh-HK",
                      viewport={"width": 1280, "height": 900}
                  )

                         try:
            loaded = False

            for attempt in range(1, 4):
                try:
                    print(f"開啟大班樓頁面，第 {attempt}/3 次")

                    await page.goto(
                        URL,
                        wait_until="domcontentloaded",
                        timeout=60000
                    )

                    loaded = True
                    break

                except Exception as e:
                    print(
                        f"第 {attempt} 次開啟失敗："
                        f"{type(e).__name__}: {e}"
                    )

                    if attempt < 3:
                        print("10 秒後重新嘗試...")
                        await page.wait_for_timeout(10000)

            if not loaded:
                print("大班樓網站連續 3 次無法開啟，本輪跳過。")
                print("這不是程式故障，不讓 GitHub Actions 標記 Failure。")
                return

            await page.wait_for_timeout(5000)

            title = await page.title()
            body = await page.locator("body").inner_text()

        finally:
            await browser.close()
              print("TITLE:", title)

              low = body.lower()

              if (
                  "access to this page has been denied" in low
                  or "確認您是人類" in body
                  or "verify you are human" in low
              ):
                  raise RuntimeError("大班樓頁面被反機器人阻擋")

              if "the chairman reservation" not in low:
                  raise RuntimeError("沒有讀到大班樓 Reservation 頁面")

              start = body.find("The Chairman Reservation")

              if start < 0:
                  start = 0

              end = body.find("ADDRESS", start)

              if end < 0:
                  end = min(len(body), start + 7000)

              booking_text = body[start:end]
              normalized = " ".join(booking_text.split())

              print("")
              print("===== 大班樓目前訂位資訊 =====")
              print(normalized[:4000])
              print("================================")

              current_hash = hashlib.sha256(
                  normalized.encode("utf-8")
              ).hexdigest()

              previous_hash = ""

              if STATE.exists():
                  previous_hash = STATE.read_text().strip()

              full_marker = (
                  "fully booked until the end of december 2026"
                  in normalized.lower()
              )

              if not previous_hash:
                  print("第一次執行：建立基準")

                  if not full_marker:
                      await notify(
                          "🚨 大班樓目前頁面已不是「2026年12月底前全滿」狀態。\n"
                          "可能已有取消位／訂位狀態改變，請立即查看官方訂位頁。\n"
                          + URL
                      )

              elif previous_hash != current_hash:
                  print("⚠️ 大班樓訂位頁內容有變化")

                  await notify(
                      "🚨 大班樓訂位頁有變化！\n\n"
                      "可能出現取消位，請立即查看。\n\n"
                      "目前頁面資訊：\n"
                      + normalized[:1200]
                      + "\n\n"
                      + URL
                  )

              else:
                  print("沒有變化，目前維持原狀。")

              STATE.write_text(current_hash)

          asyncio.run(main())

          PY

      - name: Save current status
        if: success()
        uses: actions/cache/save@v4
        with:
          path: .rw-state
          key: rw-state-${{ github.run_id }}
