name: Restaurant Watch Diagnostic

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Build monitor
        run: docker build -t restaurant-watch .

      - name: Inspect booking pages
        run: |
          docker run --rm -i \
            --entrypoint python \
            restaurant-watch - <<'PY'
          import asyncio
          from playwright.async_api import async_playwright

          sites = {
              "大班樓": "https://www.thechairmangroup.com/index.php?route=catering/booking",
              "步雲": "https://inline.app/booking/-Oj5Aw_69P4V6xr3F77M%3Ainline-live-4/-Oj5AwexaWtzyzJE5VoG?language=zh-hk",
          }

          async def inspect(name, url):
              async with async_playwright() as p:
                  browser = await p.chromium.launch(headless=True)

                  page = await browser.new_page(
                      locale="zh-HK",
                      viewport={"width": 1280, "height": 900}
                  )

                  try:
                      print("\n")
                      print("=" * 60)
                      print(f"===== {name} =====")
                      print("=" * 60)

                      await page.goto(
                          url,
                          wait_until="domcontentloaded",
                          timeout=45000
                      )

                      await page.wait_for_timeout(8000)

                      print("FINAL URL:", page.url)
                      print("TITLE:", await page.title())

                      buttons = await page.locator("button").all_inner_texts()
                      print("\nBUTTONS:")
                      for x in buttons[:100]:
                          if x.strip():
                              print("BUTTON:", repr(x.strip()))

                      inputs = page.locator("input")
                      count = await inputs.count()

                      print("\nINPUTS:", count)

                      for i in range(min(count, 50)):
                          x = inputs.nth(i)

                          print(
                              "INPUT",
                              i,
                              "type=", await x.get_attribute("type"),
                              "name=", await x.get_attribute("name"),
                              "value=", await x.get_attribute("value"),
                              "placeholder=", await x.get_attribute("placeholder"),
                              "aria=", await x.get_attribute("aria-label"),
                          )

                      selects = page.locator("select")
                      select_count = await selects.count()

                      print("\nSELECTS:", select_count)

                      for i in range(select_count):
                          s = selects.nth(i)

                          print(
                              "SELECT",
                              i,
                              "name=", await s.get_attribute("name"),
                              "aria=", await s.get_attribute("aria-label"),
                          )

                          options = await s.locator("option").all_inner_texts()
                          print("OPTIONS:", options)

                      links = page.locator("a")
                      link_count = await links.count()

                      print("\nLINKS:")

                      for i in range(min(link_count, 80)):
                          a = links.nth(i)

                          text = (await a.inner_text()).strip()
                          href = await a.get_attribute("href")

                          if text or href:
                              print(
                                  "LINK",
                                  i,
                                  repr(text),
                                  repr(href)
                              )

                      body = await page.locator("body").inner_text()

                      print("\nBODY BEGIN")
                      print(body[:20000])
                      print("BODY END")

                  except Exception as e:
                      print(f"\nERROR {name}:")
                      print(type(e).__name__, str(e))
                      raise

                  finally:
                      await browser.close()

          async def main():
              for name, url in sites.items():
                  await inspect(name, url)

          asyncio.run(main())
          PY
